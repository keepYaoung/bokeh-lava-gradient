name: bokeh_lava_gradient
description: >-
  Animated bokeh / lava gradient backgrounds for Flutter — soft colored blobs
  drifting under a Gaussian blur, with ready-made light & dark presets.
version: 1.0.2
repository: https://github.com/keepYaoung/bokeh-lava-gradient
homepage: https://github.com/keepYaoung/bokeh-lava-gradient
issue_tracker: https://github.com/keepYaoung/bokeh-lava-gradient/issues
topics:
  - animation
  - gradient
  - background
  - widget

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.9.1

flutter:
  uses-material-design: true
